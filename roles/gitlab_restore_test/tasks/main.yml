---
- name: Assert gitlab_backup_run_dir is set and has a manifest
  assert:
    that:
      - gitlab_backup_run_dir | length > 0
      - (gitlab_backup_run_dir ~ '/manifest.json') is file
    msg: "gitlab_backup_run_dir must point at a directory containing manifest.json (produced by roles/gitlab_backup)."

- name: Read the backup manifest
  set_fact:
    gitlab_manifest: "{{ lookup('file', gitlab_backup_run_dir ~ '/manifest.json') | from_json }}"

- name: Check this user can actually talk to the Docker daemon
  # Hit for real on a Jenkins agent (inbound-ssh) whose OS user wasn't in
  # the `docker` group - docker-compose failed with "permission denied
  # while trying to connect to the Docker daemon socket", both bringing
  # the container up AND (worse) in the `always:` teardown block, since
  # that failed too. Check this explicitly up front with a clear, actionable
  # message instead of letting a permission-denied surface deep inside a
  # docker-compose command's raw stderr on both the up and the teardown.
  command: docker info
  register: gitlab_docker_check
  changed_when: false
  failed_when: false

- name: Fail cleanly if the Docker daemon isn't reachable
  assert:
    that: gitlab_docker_check.rc == 0
    msg: >-
      Can't talk to the Docker daemon (docker info failed): {{ gitlab_docker_check.stderr }}
      This usually means the user running this playbook isn't in the `docker`
      group on this host. Fix: `sudo usermod -aG docker $(whoami)`, then
      restart whatever process runs this playbook (a Jenkins agent included -
      group membership only applies to new sessions/processes, not the
      currently running one).

- name: Tear down any leftover restore instance from a previous run first
  # gitlab_restore_teardown only controls what happens to THIS run's own
  # instance afterward - it must never affect whether a PREVIOUS run's
  # instance (left running via gitlab_restore_teardown=false /
  # KEEP_RESTORE_FOR_INSPECTION) gets reused. Hit for real: a prior run left
  # the container up with real projects already imported into it; this
  # run's "docker-compose up -d" silently reused that same live container
  # (already-running = no-op) instead of a fresh one, and re-importing
  # into an instance that already had same-named projects failed with a
  # path conflict on every retry - reported as a restore failure even
  # though the actual backup was fine. Always start genuinely fresh.
  command: "docker-compose -f {{ gitlab_restore_compose_file }} down -v"
  args:
    chdir: "{{ gitlab_restore_project_dir }}"
  changed_when: true
  failed_when: false

- block:
    - name: Bring up the disposable restore GitLab container
      command: "docker-compose -f {{ gitlab_restore_compose_file }} up -d"
      args:
        chdir: "{{ gitlab_restore_project_dir }}"

    - name: Wait for the restore GitLab instance to become ready
      # NOT curling gitlab_restore_url from the host: GitLab's health-check
      # endpoints are IP-allowlisted (gitlab_rails['monitoring_whitelist'],
      # default 127.0.0.0/8), and a curl against the published port from the
      # host arrives at nginx post-Docker-NAT, not as 127.0.0.1 - confirmed
      # directly (curl from the host got a real 404 while `docker exec ...
      # curl` and the compose file's own healthcheck, both running inside
      # the container's network namespace, got 200 at the very same moment).
      # Polling Docker's own healthcheck status sidesteps this entirely.
      command: docker inspect --format "{{ '{{' }}.State.Health.Status{{ '}}' }}" {{ gitlab_restore_container }}
      register: gitlab_restore_ready
      until: gitlab_restore_ready.stdout == "healthy"
      retries: "{{ gitlab_restore_ready_retries }}"
      delay: "{{ gitlab_restore_ready_delay }}"
      changed_when: false
      failed_when: false

    - name: Create an admin API token on the restore instance
      # Idempotent on purpose: gitlab_restore_teardown: false leaves this
      # container running for debugging, and a second run against the same
      # instance would otherwise hit a real PG::UniqueViolation on
      # index_personal_access_tokens_on_token_digest (hit directly, from a
      # container reused across manual testing) since the token value is a
      # fixed string, not generated fresh each run. Delete-then-create makes
      # re-running against an already-provisioned instance safe.
      command: >-
        docker exec {{ gitlab_restore_container }} gitlab-rails runner
        "u = User.find_by_username('root'); u.personal_access_tokens.where(name: 'restore-verify').delete_all; token = u.personal_access_tokens.create(scopes: ['api'], name: 'restore-verify', expires_at: 1.day.from_now); token.set_token('{{ gitlab_restore_token }}'); token.save!; puts 'TOKEN_OK'"
      register: gitlab_restore_token_result
      changed_when: false
      failed_when: "'TOKEN_OK' not in gitlab_restore_token_result.stdout"

    - name: Enable the gitlab_project import source on the restore instance
      # A fresh GitLab instance ships with `import_sources` EMPTY - confirmed
      # directly (ApplicationSetting.current.import_sources == []) after
      # POST .../projects/import returned a bare, detail-free 403 Forbidden
      # (Grape's generic authorize! rejection, not a validation error or a
      # rate limit) for every project. Enabling "gitlab_project" here is
      # scoped to this disposable, throwaway instance only - never touches
      # the real source GitLab.
      command: >-
        docker exec {{ gitlab_restore_container }} gitlab-rails runner
        "s = ApplicationSetting.current; s.update!(import_sources: (s.import_sources + ['gitlab_project']).uniq); puts 'IMPORT_SOURCE_OK'"
      register: gitlab_restore_import_source_result
      changed_when: false
      failed_when: "'IMPORT_SOURCE_OK' not in gitlab_restore_import_source_result.stdout"

    - name: Determine which group namespaces need recreating (including nested)
      # Without this, every import lands under root's own personal
      # namespace regardless of the source's group structure - reported
      # directly ("namespace‌ها درست نیست"): a source with devops/p1 and
      # dev/bb1 came back as Administrator/p1 and Administrator/bb1 on the
      # restore instance. Handles arbitrarily nested groups (a/b/c) - each
      # level created in order with the correct parent_id, via
      # create_group_namespace.yml/ensure_group_segment.yml below.
      set_fact:
        gitlab_restore_group_namespaces: "{{ gitlab_manifest | selectattr('namespace.kind', 'equalto', 'group') | map(attribute='namespace.full_path') | unique | list }}"

    - name: Create group namespaces on the restore instance, parents first
      include_tasks: create_group_namespace.yml
      loop: "{{ gitlab_restore_group_namespaces }}"
      loop_control:
        loop_var: gitlab_ns
        label: "{{ gitlab_ns }}"

    - name: Import each backed-up project into the disposable restore instance
      # NOT the uri module: confirmed directly (a same-file, side-by-side
      # comparison) that ansible.builtin.uri's body_format=form-multipart
      # corrupts this binary .tar.gz in transit - curl succeeded every time
      # on the identical file/request, the uri module failed identically
      # every time with GitLab's internal unpack reporting "gzip: stdin: not
      # in gzip format". Shelling out to curl matches the proven-working path
      # exactly. Also retries on 429 - the same rate limit GitLab applies to
      # project-export applies to project-import too (confirmed: 429
      # "requested too many times" on projects 7-10 after the first 6
      # succeeded in rapid succession). Passes namespace only for
      # group-owned projects - a user-owned project (namespace.kind ==
      # 'user') always imports into root's own personal namespace, same as
      # before, since GitLab's import API has no concept of "recreate this
      # other user's account."
      command: >-
        curl -s -X POST {{ gitlab_restore_url }}/api/v4/projects/import
        --header "PRIVATE-TOKEN: {{ gitlab_restore_token }}"
        --form "path={{ item.path }}"
        --form "name={{ item.name }}"
        {% if item.namespace.kind == 'group' %}--form "namespace={{ item.namespace.full_path }}"{% endif %}
        --form "file=@{{ gitlab_backup_run_dir }}/{{ item.id }}__{{ item.path | regex_replace('[^A-Za-z0-9_.-]', '_') }}.tar.gz"
        -w "\nHTTPSTATUS:%{http_code}"
      register: gitlab_import_start_raw
      until: gitlab_import_start_raw.stdout is search('HTTPSTATUS:201')
      retries: "{{ gitlab_import_start_retries }}"
      delay: "{{ gitlab_import_start_delay }}"
      loop: "{{ gitlab_manifest }}"
      loop_control:
        label: "{{ item.path_with_namespace }}"
      changed_when: false
      failed_when: false

    - name: Parse import-start responses
      set_fact:
        gitlab_import_start: "{{ gitlab_import_start | default([]) + [{
          'failed': (item.stdout is not search('HTTPSTATUS:201')),
          'json': (item.stdout.split('\nHTTPSTATUS:')[0] | from_json) if (item.stdout is search('HTTPSTATUS:201')) else {},
          } ] }}"
      loop: "{{ gitlab_import_start_raw.results }}"
      loop_control:
        label: "{{ item.item.path_with_namespace }}"

    - name: Wait for each import to finish
      uri:
        url: "{{ gitlab_restore_url }}/api/v4/projects/{{ gitlab_import_start[idx].json.id }}/import"
        headers:
          PRIVATE-TOKEN: "{{ gitlab_restore_token }}"
        return_content: true
      register: gitlab_import_status
      until: gitlab_import_status.json.import_status == 'finished'
      retries: "{{ gitlab_import_poll_retries }}"
      delay: "{{ gitlab_import_poll_delay }}"
      loop: "{{ gitlab_manifest }}"
      loop_control:
        index_var: idx
        label: "{{ item.path_with_namespace }}"
      when: not (gitlab_import_start[idx].failed | default(false))
      ignore_errors: true

    - name: Verify each imported project's repository actually has commits
      uri:
        url: "{{ gitlab_restore_url }}/api/v4/projects/{{ gitlab_import_start[idx].json.id }}/repository/branches"
        headers:
          PRIVATE-TOKEN: "{{ gitlab_restore_token }}"
        return_content: true
      register: gitlab_branch_check
      loop: "{{ gitlab_manifest }}"
      loop_control:
        index_var: idx
        label: "{{ item.path_with_namespace }}"
      when: not (gitlab_import_start[idx].failed | default(false))
      ignore_errors: true

    - name: Build a pass/fail summary per project
      set_fact:
        gitlab_verify_summary: "{{ gitlab_verify_summary | default([]) + [{
          'project': item.0.path_with_namespace,
          'import_ok': not (item.1.failed | default(false)) and not (item.2.failed | default(false)),
          'has_branches': (item.3.json | default([]) | length > 0) and not (item.3.failed | default(false)),
          } ] }}"
      loop: "{{ gitlab_manifest | zip(gitlab_import_start, gitlab_import_status.results, gitlab_branch_check.results) | list }}"
      loop_control:
        label: "{{ item.0.path_with_namespace }}"

    - name: Show verification summary
      debug:
        var: gitlab_verify_summary

    - name: Assert each project restored with real repository content
      assert:
        that:
          - item.import_ok
          - item.has_branches
        fail_msg: "Restore verification FAILED for {{ item.project }}"
        success_msg: "Restore verification passed for {{ item.project }}"
      loop: "{{ gitlab_verify_summary }}"
      loop_control:
        label: "{{ item.project }}"
      register: gitlab_per_project_assert
      ignore_errors: true

    - name: Final combined restore-verification result
      assert:
        that: (gitlab_per_project_assert.results | selectattr('failed', 'equalto', true) | list | length) == 0
        fail_msg: >-
          RESTORE VERIFICATION FAILED -
          {{ gitlab_per_project_assert.results | selectattr('failed', 'equalto', true) | list | length }}
          of {{ gitlab_verify_summary | length }} project(s) failed to restore correctly. See task output above for which ones.
        success_msg: "RESTORE VERIFICATION PASSED - all {{ gitlab_verify_summary | length }} project(s) restored correctly."

  always:
    # In always:, not after the verification asserts above - a look-at-it-
    # yourself need doesn't stop mattering just because verification
    # happened to pass, and (more importantly) an assert failure above
    # would otherwise skip straight past this without ever printing
    # connection info, which is exactly the case someone most wants to
    # inspect manually.
    - name: Set a random root password for browser login (kept-running instance only)
      command: >-
        docker exec {{ gitlab_restore_container }} gitlab-rails runner
        "u = User.find_by_username('root'); pw = SecureRandom.alphanumeric(20); u.password = pw; u.password_confirmation = pw; u.save!(validate: false); puts 'RESTORE_WEB_PASSWORD=' + pw"
      register: gitlab_restore_web_password_result
      when: not (gitlab_restore_teardown | bool)
      changed_when: false
      failed_when: false

    - name: Determine a reachable address for the connection-info message
      set_fact:
        gitlab_restore_public_host: "{{ ansible_facts['default_ipv4']['address'] | default(ansible_facts['hostname']) }}"
      when: not (gitlab_restore_teardown | bool)

    - name: Print restore instance connection info for manual inspection
      debug:
        msg:
          - "Restore instance kept running for manual inspection (gitlab_restore_teardown=false / KEEP_RESTORE_FOR_INSPECTION)."
          - "URL: http://{{ gitlab_restore_public_host }}:{{ gitlab_restore_public_port }}"
          - "Username: root"
          - "Password: {{ (gitlab_restore_web_password_result.stdout | default('')) | regex_search('RESTORE_WEB_PASSWORD=(.*)', '\\1') | first | default('FAILED TO SET - check the previous task output') }}"
          - "Remember to tear it down manually when done: docker-compose -f {{ gitlab_restore_compose_file }} down -v"
      when: not (gitlab_restore_teardown | bool)

    - name: Tear down the disposable restore GitLab container
      command: "docker-compose -f {{ gitlab_restore_compose_file }} down -v"
      args:
        chdir: "{{ gitlab_restore_project_dir }}"
      when: gitlab_restore_teardown | bool
