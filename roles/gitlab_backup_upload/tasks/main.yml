---
- name: Assert object storage credentials are set
  assert:
    that:
      - object_storage_access_key | length > 0
      - object_storage_secret_key | length > 0
    msg: "object_storage_access_key/object_storage_secret_key must be set (-e or a Jenkins credential binding) to upload backups to object storage."

- name: Assert retention days is in the supported range
  assert:
    that:
      - gitlab_backup_retention_days | int >= 10
      - gitlab_backup_retention_days | int <= 30
    msg: "gitlab_backup_retention_days must be between 10 and 30, got {{ gitlab_backup_retention_days }}."

- name: Check this user can actually talk to the Docker daemon
  # Same check as roles/gitlab_restore_test - this role also shells out to
  # `docker run` (the minio/mc image), so it hits the identical failure mode
  # on a Jenkins agent whose user isn't in the docker group.
  command: docker info
  register: gitlab_backup_upload_docker_check
  changed_when: false
  failed_when: false

- name: Fail cleanly if the Docker daemon isn't reachable
  assert:
    that: gitlab_backup_upload_docker_check.rc == 0
    msg: >-
      Can't talk to the Docker daemon (docker info failed): {{ gitlab_backup_upload_docker_check.stderr }}
      This usually means the user running this playbook isn't in the `docker`
      group on this host. Fix: `sudo usermod -aG docker $(whoami)`, then
      restart whatever process runs this playbook.

- name: Set the mc alias env var used by every mc invocation below
  # minio/mc ("MinIO Client") is a generic S3-compatible client, not tied
  # to a MinIO backend - works against RustFS (this project's default) or
  # any other S3-compatible endpoint the same way.
  set_fact:
    gitlab_mc_host_env: "MC_HOST_local=http://{{ object_storage_access_key }}:{{ object_storage_secret_key }}@{{ object_storage_endpoint | regex_replace('^https?://', '') }}"

- name: Ensure the backups bucket exists
  command: >-
    docker run --rm --network host
    -e {{ gitlab_mc_host_env }}
    minio/mc:latest mb --ignore-existing local/{{ object_storage_bucket }}
  changed_when: true

- name: Upload this run's backup to object storage
  # `/upload/` (trailing slash) on the SOURCE, not `/upload` - confirmed
  # directly: without it, `mc cp --recursive` nests the mount point's own
  # name (`upload/`) as an extra subdirectory in the destination instead of
  # copying its contents directly into it (like `cp -r dir dest/` vs
  # `cp -r dir/. dest/`).
  command: >-
    docker run --rm --network host
    -v {{ gitlab_backup_run_dir }}:/upload:ro
    -e {{ gitlab_mc_host_env }}
    minio/mc:latest cp --recursive /upload/ local/{{ object_storage_bucket }}/{{ gitlab_backup_run_dir | basename }}/
  register: gitlab_backup_upload_result

- name: Prune backups older than the retention window
  command: >-
    docker run --rm --network host
    -e {{ gitlab_mc_host_env }}
    minio/mc:latest rm --recursive --force --older-than {{ gitlab_backup_retention_days }}d local/{{ object_storage_bucket }}/
  register: gitlab_backup_prune_result
  changed_when: "'Removed' in gitlab_backup_prune_result.stdout"
  failed_when: false

- name: Report upload complete
  debug:
    msg: >-
      Uploaded backup to {{ object_storage_bucket }}/{{ gitlab_backup_run_dir | basename }}/
      on {{ object_storage_endpoint }} (retention: {{ gitlab_backup_retention_days }} days).

- name: Prune local backup run directories older than the same retention window
  # Object storage is the durable copy - local backups/<timestamp>/ is just
  # staging before upload. Without this, local disk grows unbounded across
  # scheduled runs even though object storage stays bounded. Only runs
  # after this run's own upload succeeds, and never touches the directory
  # this run just created (it's always newer than the cutoff).
  find:
    paths: "{{ gitlab_backup_dir }}"
    age: "{{ gitlab_backup_retention_days }}d"
    file_type: directory
    recurse: false
  register: gitlab_local_backup_prune_candidates

- name: Remove pruned local backup run directories
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ gitlab_local_backup_prune_candidates.files }}"
  loop_control:
    label: "{{ item.path }}"
