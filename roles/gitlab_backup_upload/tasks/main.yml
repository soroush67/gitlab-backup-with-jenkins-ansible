---
- name: Assert object storage credentials are set
  assert:
    that:
      - object_storage_access_key | length > 0
      - object_storage_secret_key | length > 0
    msg: "object_storage_access_key/object_storage_secret_key must be set (-e or a Jenkins credential binding) to upload backups to object storage."

- name: Assert retention days is in the supported range
  assert:
    that:
      - gitlab_backup_retention_days | int >= 10
      - gitlab_backup_retention_days | int <= 30
    msg: "gitlab_backup_retention_days must be between 10 and 30, got {{ gitlab_backup_retention_days }}."

- name: Check this user can actually talk to the Docker daemon
  # Same check as roles/gitlab_restore_test - this role also shells out to
  # `docker run` (the minio/mc image), so it hits the identical failure mode
  # on a Jenkins agent whose user isn't in the docker group.
  command: docker info
  register: gitlab_backup_upload_docker_check
  changed_when: false
  failed_when: false

- name: Fail cleanly if the Docker daemon isn't reachable
  assert:
    that: gitlab_backup_upload_docker_check.rc == 0
    msg: >-
      Can't talk to the Docker daemon (docker info failed): {{ gitlab_backup_upload_docker_check.stderr }}
      This usually means the user running this playbook isn't in the `docker`
      group on this host. Fix: `sudo usermod -aG docker $(whoami)`, then
      restart whatever process runs this playbook.

- name: Set the mc alias env var used by every mc invocation below
  # minio/mc ("MinIO Client") is a generic S3-compatible client, not tied
  # to a MinIO backend - works against RustFS (this project's default) or
  # any other S3-compatible endpoint the same way.
  set_fact:
    gitlab_mc_host_env: "MC_HOST_local=http://{{ object_storage_access_key }}:{{ object_storage_secret_key }}@{{ object_storage_endpoint | regex_replace('^https?://', '') }}"

- name: Ensure the backups bucket exists
  command: >-
    docker run --rm --network host
    -e {{ gitlab_mc_host_env }}
    minio/mc:latest mb --ignore-existing local/{{ object_storage_bucket }}
  changed_when: true

- name: Upload this run's backup to object storage
  # `/upload/` (trailing slash) on the SOURCE, not `/upload` - confirmed
  # directly: without it, `mc cp --recursive` nests the mount point's own
  # name (`upload/`) as an extra subdirectory in the destination instead of
  # copying its contents directly into it (like `cp -r dir dest/` vs
  # `cp -r dir/. dest/`).
  command: >-
    docker run --rm --network host
    -v {{ gitlab_backup_run_dir }}:/upload:ro
    -e {{ gitlab_mc_host_env }}
    minio/mc:latest cp --recursive /upload/ local/{{ object_storage_bucket }}/{{ gitlab_backup_run_dir | basename }}/
  register: gitlab_backup_upload_result

- name: Read the backup manifest (drives per-project server-side export cleanup)
  set_fact:
    gitlab_manifest: "{{ lookup('file', gitlab_backup_run_dir ~ '/manifest.json') | from_json }}"
  when: gitlab_export_cleanup_enabled | bool

- name: Check the GitLab container can be reached for server-side export cleanup
  command: "docker exec {{ gitlab_export_cleanup_container }} true"
  delegate_to: "{{ gitlab_export_cleanup_host }}"
  register: gitlab_export_cleanup_check
  changed_when: false
  failed_when: false
  when: gitlab_export_cleanup_enabled | bool

- name: Fail cleanly if the GitLab container for cleanup isn't reachable
  assert:
    that: gitlab_export_cleanup_check.rc == 0
    msg: >-
      Can't `docker exec` into {{ gitlab_export_cleanup_container }} on
      {{ gitlab_export_cleanup_host }} to clean up server-side exports:
      {{ gitlab_export_cleanup_check.stderr }}. Set gitlab_export_cleanup_enabled: false
      to skip this step, or fix gitlab_export_cleanup_container/gitlab_export_cleanup_host.
  when: gitlab_export_cleanup_enabled | bool

- name: Delete each project's server-side export now that it's safely uploaded
  # Two genuinely separate storage mechanisms feed the same
  # import_export/ directory on disk - both were confirmed live
  # (gitlab-rails runner) against this exact GitLab version, and both
  # needed real trial and error to get right:
  #
  # 1. The classic whole-archive export - Project itself has no direct
  #    export_file accessor; it's a has_many :import_export_uploads
  #    (Project#import_export_upload, singular, doesn't exist - raised
  #    "undefined method" the first time this was tried). Each row's
  #    export_file is a CarrierWave-mounted, NULLABLE column - cleared
  #    with remove_export_file! (the CarrierWave-generated bang method)
  #    + save!, NOT update!(export_file: nil): confirmed live that
  #    assigning nil directly to a mounted column is a silent no-op
  #    (CarrierWave's writer only caches new files; nil isn't treated as
  #    "remove"), so that update! "succeeded" but left the file and row
  #    completely untouched.
  #
  # 2. The newer per-relation export pipeline (what actually produces the
  #    relation_export_upload/ files reported alongside the classic ones
  #    in the original incident, e.g. releases.tar.gz, merge_requests.tar.gz)
  #    - reached via Project#export_jobs -> each ProjectExportJob's
  #    relation_exports -> each one's upload
  #    (Projects::ImportExport::RelationExportUpload). This table's
  #    export_file column is NOT NULL (confirmed live: remove_export_file!
  #    + save! here raises PG::NotNullViolation) - the row itself, not
  #    just the file, is meant to go away, via plain .destroy. Confirmed
  #    live this removes both the DB row and the on-disk file (WithUploads'
  #    own doc comment: "mounted uploaders are destroyed by carrierwave's
  #    after_commit hook"). This is also the table that had ~750 leftover
  #    rows for a single project on this dev instance alone before this
  #    role's fix went in - the real scale of what accumulates without it.
  #
  # Both together, not a raw `rm` on either - keeps GitLab's own DB state
  # in sync with storage (works the same whether storage is local disk
  # today or S3-compatible object storage if uploads_object_store gets
  # enabled later) instead of leaving rows pointing at files that no
  # longer exist. Clears every row, not just the latest - a project
  # exported more than once before cleanup ever ran (exactly what caused
  # the original incident) can have several. RecordNotFound is treated as
  # already-clean, not a failure - a project deleted between backup and
  # this step has nothing left to clean up.
  command: >-
    docker exec {{ gitlab_export_cleanup_container }} gitlab-rails runner
    "begin; p = Project.find({{ item.id | int }}); p.import_export_uploads.where.not(export_file: [nil, '']).find_each { |u| u.remove_export_file!; u.save! }; p.export_jobs.each { |job| job.relation_exports.each { |re| u = re.upload; u.destroy if u } }; puts 'EXPORT_CLEANUP_OK'; rescue ActiveRecord::RecordNotFound; puts 'EXPORT_CLEANUP_OK_SKIPPED_NOT_FOUND'; end"
  delegate_to: "{{ gitlab_export_cleanup_host }}"
  register: gitlab_export_cleanup_result
  changed_when: false
  failed_when: "'EXPORT_CLEANUP_OK' not in gitlab_export_cleanup_result.stdout"
  loop: "{{ gitlab_manifest }}"
  loop_control:
    label: "{{ item.path_with_namespace }}"
  when: gitlab_export_cleanup_enabled | bool

- name: Report server-side export cleanup complete
  debug:
    msg: "Cleaned up server-side export files for {{ gitlab_manifest | length }} project(s) on {{ gitlab_export_cleanup_container }}."
  when: gitlab_export_cleanup_enabled | bool

- name: Prune backups older than the retention window
  command: >-
    docker run --rm --network host
    -e {{ gitlab_mc_host_env }}
    minio/mc:latest rm --recursive --force --older-than {{ gitlab_backup_retention_days }}d local/{{ object_storage_bucket }}/
  register: gitlab_backup_prune_result
  changed_when: "'Removed' in gitlab_backup_prune_result.stdout"
  failed_when: false

- name: Report upload complete
  debug:
    msg: >-
      Uploaded backup to {{ object_storage_bucket }}/{{ gitlab_backup_run_dir | basename }}/
      on {{ object_storage_endpoint }} (retention: {{ gitlab_backup_retention_days }} days).

- name: Prune local backup run directories older than the same retention window
  # Object storage is the durable copy - local backups/<timestamp>/ is just
  # staging before upload. Without this, local disk grows unbounded across
  # scheduled runs even though object storage stays bounded. Only runs
  # after this run's own upload succeeds, and never touches the directory
  # this run just created (it's always newer than the cutoff).
  find:
    paths: "{{ gitlab_backup_dir }}"
    age: "{{ gitlab_backup_retention_days }}d"
    file_type: directory
    recurse: false
  register: gitlab_local_backup_prune_candidates

- name: Remove pruned local backup run directories
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ gitlab_local_backup_prune_candidates.files }}"
  loop_control:
    label: "{{ item.path }}"
