---
# The S3-compatible object storage backups get uploaded to via the
# minio/mc CLI image (mc is a generic S3-compatible client - "MinIO
# Client" is just its name, it works against any S3-compatible backend,
# RustFS included). Defaults point at this project's own
# docker-compose.rustfs.yml (dev/testing) - point at a real endpoint for
# production use via -e or a Jenkins credential binding.
object_storage_endpoint: "http://localhost:9010"
object_storage_access_key: ""
object_storage_secret_key: ""
object_storage_bucket: "gitlab-backups"

# Adjustable 10-30 days per requirement. Anything already in the bucket
# older than this gets pruned on every run - not just what this run
# uploaded. The same window also prunes local backups/<timestamp>/ run
# directories (object storage is the durable copy; local is just staging).
gitlab_backup_retention_days: 30

# Matches roles/gitlab_backup/defaults/main.yml's gitlab_backup_dir -
# duplicated (not relied on via cross-role variable bleed) so this role
# stays correct even if run order or role composition ever changes.
gitlab_backup_dir: "{{ playbook_dir }}/../backups"

# Delete each project's server-side export file on the GitLab host itself
# (via `docker exec ... gitlab-rails runner`) once this run's backup has
# been uploaded to object storage. GitLab's Project Export API has no REST
# endpoint to force this - the file otherwise lingers until GitLab's own
# internal expiry worker runs, hours later, and does so for EVERY project
# this job has ever exported, not just this run's, which is what filled
# /var/opt/gitlab in the first place at real scale. Runs only after upload
# succeeds - same "never touch something that isn't safely offsite yet"
# ordering the local run-dir prune below already follows. See README
# "Design notes" for why this uses update!(export_file: nil) on the
# CarrierWave-mounted column instead of a raw `rm` on the file.
gitlab_export_cleanup_enabled: true
# Name of the GitLab container to `docker exec` into. Defaults to this
# project's own throwaway gitlab-source dev instance.
gitlab_export_cleanup_container: "gitlab-source"
# Host `docker exec` runs on - the box actually running the GitLab
# container. Defaults to localhost, true for this project's dev instance
# (Ansible and gitlab-source share a host) - point this at the real
# production GitLab host (added to inventory with SSH access) for real
# deployments where GitLab doesn't run on the same box as Ansible/Jenkins.
gitlab_export_cleanup_host: "localhost"
