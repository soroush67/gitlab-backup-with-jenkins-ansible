---
# The GitLab instance being backed up. Point this at the real self-hosted
# GitLab when there is one - defaults to the throwaway `gitlab-source`
# container this project ships for development/testing (see
# docker-compose.gitlab-source.yml).
gitlab_url: "http://localhost:8929"
gitlab_token: ""

gitlab_backup_dir: "{{ playbook_dir }}/../backups"
# Set by the playbook per-run (timestamped subdirectory) - overridable so
# backup_and_verify.yml can point the verify role at exactly what backup.yml
# just produced.
gitlab_backup_run_dir: "{{ gitlab_backup_dir }}/{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

gitlab_export_poll_retries: 30
gitlab_export_poll_delay: 10

# GitLab throttles POST .../export fairly aggressively - retry-with-backoff
# settings for starting each export (separate from polling its completion).
gitlab_export_start_retries: 12
gitlab_export_start_delay: 8

# Extra pause between finishing one project (export + download) and
# starting the next one's export - on top of exports already being fully
# sequential (see roles/gitlab_backup/tasks/backup_one_project.yml).
# 0 by default (no extra pause). Raise this if GitLab is still under
# heavy load with fully-sequential exports alone, e.g. at very large
# project counts (100+) - Jenkins: INTER_PROJECT_DELAY_SECONDS.
gitlab_backup_inter_project_delay_seconds: 0
